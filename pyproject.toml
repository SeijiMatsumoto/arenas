[project]
name = "arenas-hub"
version = "0.1.0"
description = "Index of measured engineering decisions: one page built from every arena's latest summary."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "arena-kit",
  "httpx>=0.28.0",
  "pyyaml>=6.0.2",
]

[project.scripts]
hub = "arena_hub.build:main"

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[tool.uv.workspace]
members = ["kit"]

[tool.uv.sources]
arena-kit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena_hub"]

[tool.pytest.ini_options]
testpaths = ["tests", "kit/tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["kit/src/arena_kit/template"]
