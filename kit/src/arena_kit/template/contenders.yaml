# One entry per contender; adding one is one entry. Every LLM goes through OpenRouter.
# price_in/price_out (USD per 1M tokens) are used only when OpenRouter doesn't report cost.
# mock_accuracy and mock_latency_ms only shape `arena run --mock`.
contenders:
  - name: keyword-rules
    type: rules
  - name: gemini-3.5-flash-lite
    type: llm
    model: google/gemini-3.5-flash-lite
    price_in: 0.3
    price_out: 2.5
    mock_accuracy: 0.9
    mock_latency_ms: 400
  - name: haiku-5.5
    type: llm
    model: anthropic/claude-haiku-5.5
    price_in: 0.1
    price_out: 0.5
    mock_accuracy: 0.92
    mock_latency_ms: 600
