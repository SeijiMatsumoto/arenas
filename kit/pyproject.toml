[project]
name = "arena-kit"
version = "0.1.0"
description = "Shared plumbing for arenas: cached OpenRouter client, mock providers, paired tests, fixed-rule picks, snapshots and the summary contract."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.0",
  "jsonschema>=4.23.0",
  "python-dotenv>=1.1.1",
  "pyyaml>=6.0.2",
  "rich>=14.1.0",
]

[project.scripts]
arena-kit = "arena_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena_kit"]
